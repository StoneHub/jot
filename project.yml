name: Jot
options:
  bundleIdPrefix: space.jot
  deploymentTarget:
    macOS: '14.0'
packages:
  AppleFM:
    url: https://github.com/StoneHub/apple-fm-swift.git
    revision: 5b937241b0236f892af28588e75a78dd557acf21
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 5c19d5e12320e22bbfb7a1877b089d2665a69add
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  JotCore:
    type: framework
    platform: macOS
    sources: [Sources/JotCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: space.jot.core
    dependencies:
      - package: AppleFM
      - sdk: libsqlite3.tbd
  JotCLI:
    type: tool
    platform: macOS
    sources: [Sources/JotCLI]
    settings:
      base:
        PRODUCT_NAME: jot
        LD_RUNPATH_SEARCH_PATHS: '@executable_path/../Frameworks'
    dependencies:
      - target: JotCore
  JotRecoveryChecks:
    type: tool
    platform: macOS
    sources:
      - scripts/check-recovery-flow.swift
      - scripts/check-capture-flow.swift
      - scripts/check-store-responsiveness.swift
      - scripts/check-shortcut-input.swift
      - Sources/Jot/AccessibilityElement.swift
      - Sources/Jot/PreparedSpeakerModels.swift
      - Sources/Jot/AudioInputDevice.swift
      - Sources/Jot/AudioInputDeviceWatcher.swift
      - Sources/Jot/AudioJob.swift
      - Sources/Jot/AudioClock.swift
      - Sources/Jot/SpeechOutput.swift
      - Sources/Jot/JotError.swift
      - Sources/Jot/CaptureController.swift
      - Sources/Jot/DictationCoordinator.swift
      - Sources/Jot/DictationHighlight.swift
      - Sources/Jot/DictationInput.swift
      - Sources/Jot/SuggestionFieldReadback.swift
      - Sources/Jot/SuggestionFieldReader.swift
      - Sources/Jot/ShortcutEventTap.swift
      - Sources/Jot/ShortcutTargetTicket.swift
      - Sources/Jot/ShortcutTargetAcquisition.swift
      - Sources/Jot/KeepAwakeAssertion.swift
      - Sources/Jot/ListeningTimeline.swift
      - Sources/Jot/LiveCleanup.swift
      - Sources/Jot/MicrophoneCapture.swift
      - Sources/Jot/RecognitionCommitWindow.swift
      - Sources/Jot/ResourceSnapshot.swift
      - Sources/Jot/ResourceSampler.swift
      - Sources/Jot/SessionAudioFile.swift
      - Sources/Jot/SessionLibrary.swift
      - Sources/Jot/ShortcutSettings.swift
      - Sources/Jot/SuggestionCard.swift
      - Sources/Jot/SuggestionCoordinator.swift
      - Sources/Jot/ScreenContextReader.swift
      - Sources/Jot/WindowImageCapture.swift
      - Sources/Jot/SpeakerPass.swift
      - Sources/Jot/MappedFloat32Source.swift
      - Sources/Jot/SpeakerRecognizer.swift
      - Sources/Jot/SpeechPipeline.swift
      - Sources/Jot/CaptureEventKind.swift
      - Sources/Jot/SpeechServiceDependencies.swift
      - Sources/Jot/SpeechService.swift
      - Sources/Jot/SpeechServiceIPC.swift
      - Sources/Jot/Transcriber.swift
    settings:
      base:
        PRODUCT_NAME: JotRecoveryChecks
        LD_RUNPATH_SEARCH_PATHS: '@executable_path'
    dependencies:
      - target: JotCore
      - package: FluidAudio
  Jot:
    type: application
    platform: macOS
    sources:
      - Sources/Jot
      - path: Resources/Assets.xcassets
      - path: Resources/Jot.icns
        buildPhase: resources
      - path: Resources/ThirdPartyNotices.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Jot
        CFBundleIconFile: Jot.icns
        CFBundleShortVersionString: '0.2.12'
        CFBundleVersion: '19'
        LSUIElement: true
        NSMicrophoneUsageDescription: Jot transcribes your microphone locally for dictation and ambient transcripts. Session audio is kept only until the speaker pass finishes, then deleted.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.jot.app
        PRODUCT_NAME: Jot
        CODE_SIGN_ENTITLEMENTS: Resources/Jot.entitlements
    dependencies:
      - target: JotCore
      - package: FluidAudio
      - target: JotCLI
        embed: false
    postBuildScripts:
      - name: Bundle agent CLI
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/jot" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/jot"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/jot
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/jot
  JotWindowChecks:
    type: tool
    platform: macOS
    sources:
      - Sources/Jot
      - Tests/JotWindowChecks
    settings:
      base:
        PRODUCT_NAME: JotWindowChecks
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) JOT_WINDOW_CHECKS'
        LD_RUNPATH_SEARCH_PATHS: '@executable_path'
    dependencies:
      - target: JotCore
      - package: FluidAudio
schemes:
  Jot:
    build:
      targets:
        Jot: all
  JotRecoveryChecks:
    build:
      targets:
        JotRecoveryChecks: all
  JotWindowChecks:
    build:
      targets:
        JotWindowChecks: all
