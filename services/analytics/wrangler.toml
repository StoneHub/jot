name = "jot-analytics"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Request logs would hold IP addresses; Jot's analytics keeps none.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "jot-analytics"
# Created with `wrangler d1 create jot-analytics` (see README.md). A database id is not a secret: deploying needs the account login too.
database_id = "663e42e9-7115-463d-8939-35b62f2eac65"
