name = "jot-analytics"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Request logs would hold IP addresses; Jot's analytics keeps none.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "jot-analytics"
# Filled in by `wrangler d1 create jot-analytics` (see README.md).
database_id = "REPLACE_WITH_DATABASE_ID"
