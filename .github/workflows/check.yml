name: Core checks
# Local validation is the default while Monroe's Mac is available. Run this
# manually only when work must be validated without that machine.
on:
  workflow_dispatch:
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Storage and local transport tests
        run: swift test
      - name: App compile (unsigned; signing and installation stay local)
        run: xcodebuild -project Jot.xcodeproj -scheme Jot -configuration Debug -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
      - name: Signing ownership checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Feedback removal guard
        run: python3 scripts/check-no-feedback.py
